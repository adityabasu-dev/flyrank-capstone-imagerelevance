name: flyrank-capstone-imagerelevance
runner: python
run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python seed.py
test: pytest
base_url: http://localhost:8000
endpoints:
  process_batch: POST /api/v1/images/batch
  match_post: GET /api/v1/posts/{id}/images
  review_decision: POST /api/v1/reviews